 * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color:  #005f73;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    /* Gallery Container */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    /* Gallery Items */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      background: #fff;
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.1);
    }
    /* Overlay Caption */
    .overlay {
      position: absolute;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      width: 100%;
      padding: 10px;
      text-align: center;
      color: #fff;
      font-size: 1.2rem;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .gallery-item:hover .overlay {
      opacity: 1;
    }
    /* Responsive adjustments */
    @media (max-width: 600px) {
      .overlay {
        font-size: 1rem;
      }
    }
</style>
